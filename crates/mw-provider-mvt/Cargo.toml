[package]
name = "mw-provider-mvt"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
anyhow.workspace = true
async-trait.workspace = true
mw-core = { path = "../mw-core" }
mw-telemetry = { path = "../mw-telemetry" }
prost = "0.14"
prost-types = "0.14"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
prost-build = "0.14.3"
protoc-bin-vendored = "3"
