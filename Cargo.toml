[workspace]
members = [
    "crates/mw-core",
    "crates/mw-provider-mvt",
    "crates/mw-render-wgpu",
    "crates/mw-telemetry",
    "apps/native-viewer",
    "apps/web-viewer",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["MapWeave Lab Contributors"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
log = "0.4"
env_logger = "0.11"
wasm-logger = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
wgpu = "26"
